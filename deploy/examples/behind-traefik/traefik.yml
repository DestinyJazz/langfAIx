# Example: a Traefik stack that terminates HTTPS for langfAIx and obtains certificates
# from Let's Encrypt with the DNS-01 challenge, here through Cloudflare.
#
# Why DNS-01: it needs no port open to the internet, so it works for a server on an
# internal network. The host names are public DNS records that point at the server's
# internal address; users reach it from inside the network or through a VPN, and their
# computers trust the certificate without installing anything.
#
# Environment variables of this stack:
#   CF_DNS_API_TOKEN   Cloudflare API token with Zone/Zone/Read and Zone/DNS/Edit, limited to your zone
#   ACME_EMAIL         the email address registered with Let's Encrypt
#
# With another DNS provider, change the provider name and its variables; see Traefik's
# documentation on ACME DNS providers.
#
# STATUS: adapted from a setup that runs in production; this exact file has not been run.
# If you already have a Traefik, add the certificate resolver to it instead of starting
# a second one.

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # The certificate resolver. The langfAIx stack refers to it by the name le.
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      # Certificates are kept in this file, on a volume, so they survive recreating the container.
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # If your firewall blocks outgoing DNS queries (port 53), Traefik cannot verify the
      # temporary record itself and times out. Then skip its own check and just wait:
      # - "--certificatesresolvers.le.acme.dnschallenge.propagation.disableChecks=true"
      # - "--certificatesresolvers.le.acme.dnschallenge.propagation.delayBeforeChecks=60s"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  # The langfAIx stack joins this network (there it is declared as external).
  proxy:
    name: proxy

volumes:
  traefik-letsencrypt:
    name: traefik-letsencrypt
